name: Quality and Synthetic Preview Deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned package manager
        run: python -m pip install uv==0.11.26
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Check lockfile
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Strategy schema
        run: uv run python scripts/generate_strategy_schema.py --check
      - name: Data schemas
        run: uv run python scripts/generate_data_snapshot_schema.py --check
      - name: Research schemas
        run: uv run python scripts/generate_research_schemas.py --check
      - name: Execution schemas
        run: uv run python scripts/generate_execution_schemas.py --check
      - name: Tests
        run: uv run pytest -q
      - name: Synthetic end-to-end smoke
        run: uv run python -m ats.demo --output .local/ci-demo
      - name: Package synthetic preview without Azure credentials
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./infra/prepare-preview.ps1 -ReportPath .local/ci-demo/report.json -OutputDirectory .local/azure-preview/ci -SourceCommit $env:GITHUB_SHA
      - name: Validate preview package offline
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./infra/publish-preview.ps1 -PackageDirectory .local/azure-preview/ci/package -ExpectedCommit $env:GITHUB_SHA
      - name: Test CI publication boundaries offline
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./infra/test-preview-ci.ps1 -PackageDirectory .local/azure-preview/ci/package -ExpectedCommit $env:GITHUB_SHA
      - name: Upload verified synthetic package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/azure-preview/ci/package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy_preview:
    needs: quality
    if: >-
      github.repository == 'hahaysh/demo-trading' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.ATS_PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: ats-preview
      url: https://app-atsview-dev-ac2a.azurewebsites.net/
    concurrency:
      group: ats-preview-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/azure-preview/download/package
      - name: Revalidate artifact before Azure login
        run: ./infra/publish-preview.ps1 -PackageDirectory .local/azure-preview/download/package -ExpectedCommit $env:GITHUB_SHA
      - name: Skip superseded main commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api repos/hahaysh/demo-trading/git/ref/heads/main --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current main commit.' }
          $current = ($head -ceq $env:GITHUB_SHA).ToString().ToLowerInvariant()
          "current=$current" >> $env:GITHUB_OUTPUT
          if ($current -eq 'false') { 'Superseded commit: no Azure deployment.' >> $env:GITHUB_STEP_SUMMARY }
      - name: Azure login with OIDC
        if: steps.current.outputs.current == 'true'
        id: azure_login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish and verify owner-only synthetic preview
        if: steps.current.outputs.current == 'true'
        id: publish
        run: ./infra/publish-preview.ps1 -PackageDirectory .local/azure-preview/download/package -ExpectedCommit $env:GITHUB_SHA -Execute
      - name: Fail closed on incomplete publishing
        if: always() && steps.azure_login.outcome == 'success' && steps.publish.outcome != 'success'
        run: |
          $token = $null
          $headers = $null
          try {
            $token = az account get-access-token --subscription 199bfb5d-fa2d-4765-88cf-016129ccb7de --resource https://management.azure.com/ --query accessToken -o tsv
            if ($LASTEXITCODE -ne 0) { throw 'Fail-closed token unavailable; operator intervention required.' }
            $headers = @{Authorization="Bearer $token"}
            $uri = 'https://management.azure.com/subscriptions/199bfb5d-fa2d-4765-88cf-016129ccb7de/resourceGroups/atsview-rg/providers/Microsoft.Web/sites/app-atsview-dev-ac2a?api-version=2026-08-01'
            $null = Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -ContentType 'application/json' -Body (@{properties=@{publicNetworkAccess='Disabled'}} | ConvertTo-Json -Depth 3) -TimeoutSec 60
            $site = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
            if ($site.properties.publicNetworkAccess -ne 'Disabled') { throw 'Ingress closure not confirmed; operator intervention required.' }
          } finally { $token=$null; $headers=$null }
      - name: Azure logout
        if: always() && steps.azure_login.outcome == 'success'
        run: az logout