[project]
name = "demo-trading"
version = "0.1.0"
description = "Governed research and paper-trading system for Korean equities and ETFs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "defusedxml==0.7.1",
    "fastapi==0.142.2",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ats"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ats"]
